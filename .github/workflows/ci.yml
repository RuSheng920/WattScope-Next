name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # wrapper 默认指向华为镜像（国内快），CI 里换回官方源，避免境外 runner 拉不动
      - name: Use official Gradle distribution
        run: |
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      # runner 自带 Android SDK；预装失败不致命 —— AGP 8 默认会自动下载缺失的
      # platform / build-tools，这里只是提前装好以节省时间
      - name: Prepare Android SDK
        run: |
          if command -v sdkmanager > /dev/null 2>&1; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" \
              || echo "::warning::sdkmanager 预安装失败，改由 AGP 自动下载"
          else
            echo "::warning::runner 未提供 sdkmanager，依赖 AGP 自动下载 SDK 组件"
          fi
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compile debug
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
