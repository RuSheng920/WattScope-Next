name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 镜像有时不带 Android SDK；这里自建一份 cmdline-tools 兜底，
      # 已具备可用 sdkmanager 时直接复用，避免无谓下载
      - name: Install Android SDK
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "复用镜像自带 SDK: $ANDROID_HOME"
          else
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            curl -sSLo /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
            mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
            echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
            echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"

      # wrapper 默认指向华为镜像（国内快），CI 里换回官方源，避免境外 runner 拉不动
      - name: Use official Gradle distribution
        run: |
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compile debug
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          tail -60 build.log
          exit $code

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
