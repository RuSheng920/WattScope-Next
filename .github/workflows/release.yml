name: release

# 推 v* 标签即发布：CI 编译 Release APK，用内置 GITHUB_TOKEN 创建 Release 并上传资产。
# 不再需要本地打包，也不再需要 fine-grained PAT。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # wrapper 默认指向华为镜像（国内快），CI 里换回官方源，避免境外 runner 拉不动
      - name: Use official Gradle distribution
        run: |
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      # runner 镜像有时不带 Android SDK；这里自建一份 cmdline-tools 兜底，
      # 已具备可用 sdkmanager 时直接复用，避免无谓下载
      - name: Install Android SDK
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "复用镜像自带 SDK: $ANDROID_HOME"
          else
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            curl -sSLo /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
            mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
            echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
            echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-release-${{ runner.os }}-

      # release.jks 与 keystore.properties 都在 .gitignore 里，CI 用 secrets 还原。
      # secrets 未配置时跳过，产出未签名 APK 并标记为 prerelease。
      - name: Restore signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置 RELEASE_KEYSTORE_BASE64，本次将发布未签名 APK"
            echo "SIGNING=none" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon --console=plain > build.log 2>&1
          code=$?
          tail -60 build.log
          exit $code

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: build.log
          if-no-files-found: warn

      - name: Resolve APK and version
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "WattScope-Next-v${VERSION}.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "WattScope-Next-v${VERSION}-unsigned.apk"
          fi

      # 发布说明直接取 README「更新日志」里对应版本的小节，避免正文和仓库文档打架
      - name: Extract release notes from README
        run: |
          python3 scripts/extract_release_notes.py "${{ steps.apk.outputs.version }}" > release_body.md
          head -3 release_body.md

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WattScope Next ${{ github.ref_name }}
          body_path: release_body.md
          files: |
            WattScope-Next-v${{ steps.apk.outputs.version }}*.apk
          fail_on_unmatched_files: true
          prerelease: ${{ env.SIGNING == 'none' }}
          append_body: false
