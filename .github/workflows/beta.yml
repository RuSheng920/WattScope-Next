name: beta
run-name: beta · ${{ github.ref_name }}

# 测试版构建：推 beta/* 标签即产出**已签名** APK，作为 Actions 资产上传。
#
# 与 release.yml 的差别在发布形态：
# - release.yml 由 `v*` 标签触发，建正式 Release（应用内「正式版」通道取它）。
# - 本工作流由 `beta/*` 标签触发，APK 既挂 Actions 资产，也建一个 **prerelease**
#   Release —— 应用内「Beta 通道」走 Releases API，而 Actions 资产匿名不可下载。
#   正式通道只认非 prerelease，测试版不会漏进正式更新。
#
# 为什么不用 `v*beta*` 这类标签名：release.yml 的触发条件是 `tags: ['v*']`，
# 而 `v*` 会匹配任何以 v 开头的标签 —— 用 `v1.2.3-beta.1` 会同时触发两个工作流、
# 照样建出 Release。`beta/` 前缀则与 `v*` 完全不重叠，互不干扰。
#
# prerelease 只保留最新一个：应用内 Beta 通道按版本号取最高者，旧 prerelease
# 堆在 Releases 列表里只会让人下错包。发布成功后自动删除其它 beta/* 的
# prerelease 及其 git 标签；正式 Release 不是 prerelease，天然不受影响。
#
# prerelease 正文：优先取标签提交里的 `beta-notes/<version>.md`（真实更新日志，
# 只进临时提交不进 main —— README 是主页、docs/ 是官网，都不该被测试版污染），
# 取不到退化成通用占位文案。见 scripts/beta_release_body.py。
#
# 签名单独成一条链路：测试版必须用 release.jks 签名，否则与已装的正式版
# 签名不一致，无法覆盖安装。
on:
  push:
    tags: ['beta/*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的分支或提交（留空用当前）'
        required: false
        type: string

permissions:
  # contents: write —— 测试版也要建 prerelease Release，应用内更新才能读到它
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # wrapper 默认指向华为镜像（国内快），CI 里换回官方源，避免境外 runner 拉不动
      - name: Use official Gradle distribution
        run: |
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      # runner 镜像有时不带 Android SDK。注意 $GITHUB_PATH 只对后续步骤生效，
      # 所以本步骤内一律用绝对路径调用 sdkmanager。
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-$HOME/android-sdk}"
          SDKM="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ] && [ -x "$SDK_DIR/cmdline-tools/bin/sdkmanager" ]; then
            # 有的镜像把 cmdline-tools 直接铺在 cmdline-tools/bin 下，补一个 latest 布局
            mkdir -p "$SDK_DIR/cmdline-tools/latest"
            cp -r "$SDK_DIR/cmdline-tools/bin/." "$SDK_DIR/cmdline-tools/latest/"
          fi
          if [ ! -x "$SDKM" ]; then
            echo "runner 未提供可用的 cmdline-tools，自行下载"
            rm -rf "$HOME/android-sdk"
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
            test -d "$HOME/android-sdk/cmdline-tools/cmdline-tools"
            mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
            SDKM="$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "sdkmanager=$SDKM ANDROID_HOME=$SDK_DIR"

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-beta-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-beta-${{ runner.os }}-

      # 签名：测试版必须与正式版同一把密钥，否则无法覆盖安装已装的正式版。
      # release.jks 与 keystore.properties 都在 .gitignore 里，用 secrets 还原。
      - name: Restore signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 去掉粘贴时可能带入的空白/换行，避免 base64 -d 报 invalid input
          B64=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')
          if [ "${#B64}" -eq 0 ]; then
            echo "::error::未配置 RELEASE_KEYSTORE_BASE64，无法产出可覆盖安装的测试版"
            exit 1
          fi
          if ! printf '%s' "$B64" | base64 -d > release.jks 2>/dev/null; then
            echo "::error::base64 解码失败（长度 ${#B64}）"
            exit 1
          fi
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          # 记录指纹：确认拿到的确实是与正式版同一把密钥
          keytool -list -v -keystore release.jks -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" \
            | grep -E "SHA256:" | head -1

      # Windows 上建的仓库可能没给 gradlew 可执行位（git mode 100644）
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build signed release APK
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon --console=plain > build.log 2>&1
          code=$?
          tail -60 build.log
          exit $code

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-build-log
          path: build.log
          if-no-files-found: warn

      - name: Resolve APK and version
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "WattScope-Next-v${VERSION}.apk"
          else
            echo "::error::未产出 app-release.apk"
            exit 1
          fi
          ls -l "WattScope-Next-v${VERSION}.apk"

      # 校验签名：确认产物确实被 release.jks 签过（未签名的 APK 装不上也覆盖不了）
      - name: Verify APK signature
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            "WattScope-Next-v${{ steps.apk.outputs.version }}.apk" | grep -E "Signer #1 certificate SHA-256"

      # 只作为 Actions 资产上传，不创建 Release —— 这是与 release.yml 的唯一区别
      - name: Upload beta APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta-apk
          path: WattScope-Next-v${{ steps.apk.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30

      # 正文来源：beta-notes/<version>.md（随标签提交）优先，缺失退化为通用文案。
      # 用脚本而不是在 workflow 里写 heredoc：能本地直接跑，YAML 缩进与
      # ${{ }} 表达式不纠缠。正式版的对应逻辑见 extract_release_notes.py。
      - name: Resolve beta release notes
        run: |
          python3 scripts/beta_release_body.py "${{ steps.apk.outputs.version }}" > release_body.md
          head -3 release_body.md

      # Actions 资产匿名不可下载，应用内「Beta 通道」无从获取安装包。
      # 因此测试版额外建一个 **prerelease** Release：正式通道（只取非 prerelease）
      # 看不到它，Beta 通道能看到并按版本号参与比较。
      - name: Publish beta prerelease
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WattScope Next v${{ steps.apk.outputs.version }} Beta
          body_path: release_body.md
          files: WattScope-Next-v${{ steps.apk.outputs.version }}.apk
          prerelease: true
          fail_on_unmatched_files: true

      # 先发布、后清理：万一发布失败，旧 prerelease 还在，不至于一个都不剩。
      # gh release list 的 --jq 过滤同时要求 isPrerelease 与 beta/ 前缀，
      # 双保险，绝不误删正式 Release。删除失败只警告不中断 —— 清理是锦上添花，
      # 不该让已经发布成功的 beta 红字。
      - name: Prune stale beta prereleases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          CURRENT="${{ github.ref_name }}"
          gh release list --limit 200 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("beta/"))) | .tagName' \
            | while read -r tag; do
                [ -z "$tag" ] && continue
                [ "$tag" = "$CURRENT" ] && continue
                echo "::notice::prune stale prerelease $tag"
                gh release delete "$tag" --yes --cleanup-tag \
                  || echo "::warning::delete $tag failed, skipped"
              done
          echo "prune done"
