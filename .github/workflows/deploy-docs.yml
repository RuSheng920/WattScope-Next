name: deploy-docs
run-name: docs · ${{ github.ref_name }}

# 官网/文档站部署：推送 main 即构建 VitePress 并发布到 GitHub Pages。
# 站点源目录就是 docs/（与项目文档同源）。
#
# 唯一的一次性手动设置：仓库 Settings → Pages → Source 选 "GitHub Actions"。
# （configure-pages 的 enablement 选项需要 PAT，GITHUB_TOKEN 无权代为开启。）
#
# 自定义域名：在 Settings → Pages → Custom domain 填 watt.rusheng.top，再去 DNS 加
#   CNAME  watt  →  rusheng920.github.io
# 不要把域名提前写进产物（docs/public/CNAME）：DNS 未生效时 GitHub 会把 github.io
# 一并重定向到该域名，两边都打不开。
on:
  push:
    branches: [main]
    # 只在这几类文件变动时重建站点。没有过滤的话，纯代码提交（甚至只改 README）
    # 也会跑一次 npm ci + build + deploy，Actions 列表里全是无意义的 docs 记录。
    # 必须保留 app/build.gradle.kts：导航栏版本号是从它的 versionName grep 出来的，
    # 漏掉会导致发版后站点版本号滞后。本文件自身也在列，改工作流要能验证构建。
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app/build.gradle.kts'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 导航栏的版本号跟随 build.gradle.kts，发版后无需手改文档站。
      - name: Sync app version
        run: |
          set -uo pipefail
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1 || true)
          if [ -n "${VERSION:-}" ]; then
            printf '{\n  "version": "v%s"\n}\n' "$VERSION" > docs/.vitepress/release.json
            echo "release.json -> v$VERSION"
          else
            echo "::warning::未能从 build.gradle.kts 读到版本号，沿用现有 release.json"
          fi

      - name: Build with VitePress
        run: npm run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
